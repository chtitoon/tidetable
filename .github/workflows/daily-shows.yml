name: Shows Export

# Scrapes the venues in venues.yaml and commits data/shows.json (every
# upcoming show they list, however far out). Needs no secrets. See "Show listings" in the README.

on:
  schedule:
    # Every other day (odd days of the month) at 11:23 UTC (06:23 New York),
    # off the top of the hour. Months with 31 days run on the 31st and the 1st.
    - cron: '23 11 */2 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # commit data/shows.json

concurrency:
  group: daily-shows
  cancel-in-progress: false

jobs:
  export-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./lescraper/... ./showexport

      # Exits non-zero (failing the job) only if every venue fails. A venue
      # that fails on its own is recorded in the file with ok:false (with its
      # shows kept if it only stopped short, e.g. at the page cap).
      - name: Scrape venues
        run: go run . -out data/shows.json

      - name: Flag failed venues
        run: |
          jq -r '.venues[] | select(.ok | not) | "::warning title=\(.name) failed::\(.error)"' data/shows.json

      - name: Commit if anything besides generated_at changed
        run: |
          set -euo pipefail
          FILE=data/shows.json
          if git cat-file -e "HEAD:$FILE" 2>/dev/null && \
             cmp -s <(git show "HEAD:$FILE" | jq -S 'del(.generated_at)') <(jq -S 'del(.generated_at)' "$FILE"); then
            echo "No changes besides generated_at; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Update shows.json"
          # Another workflow may have pushed meanwhile (daily-artists in "self" mode).
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
